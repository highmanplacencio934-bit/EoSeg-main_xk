# Innovation 1 only; baseline scientific settings inherited unchanged.
trainer:
  default_root_dir: "outputs/innovation1/asee_reference"
  max_epochs: 220
  limit_val_batches: 0
  check_val_every_n_epoch: 1000000
  precision: 16-mixed

  # Test set participates in checkpoint selection, but never gradient updates.
  enable_checkpointing: false
  callbacks:
  - class_path: training.synapse_test_selection.SynapseTestSelection
    init_args:
      last_n_epochs: 50
      expected_test_cases: 12
      output_dir: "outputs/innovation1/asee_reference"

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      save_dir: "outputs/innovation1"
      resume: allow
      project: "eomt"
      name: "vit_query_mul_scale_fusion_asee_reference" 

model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    num_classes: 9
    img_size: [384, 384]
    attn_mask_annealing_enabled: False
    ignore_idx: 255
    lr: 2e-4
  
    network:
      class_path: models.eoseg_asee.EoSegMultiQSegFusionASEE
      init_args:
        num_classes: 9
        num_q: 16
        prior_path: "priors/synapse_asee_v1.pt"
        queries_per_class: 2
        patch_update: "reference_gated"
        freeze_text_projection: false
        enhance_patch: true
        enhance_query: true
        use_text: true
        use_probability: true
        encoder:
          class_path: models.vit.ViT

data:
  class_path: datasets.synapse_semantic.SynapseSemantic
  init_args:
    train_base_dir: "project_TransUNet/data/Synapse/train_npz"
    test_base_dir: "project_TransUNet/data/Synapse/test_vol_h5"
    list_dir: "project_TransUNet/TransUNet/lists/lists_Synapse"
    train_split: train
    test_split: test_vol
    img_size: [384, 384]
    num_classes: 9
    batch_size: 16
    num_workers: 8
    ignore_idx: 255
    drop_background: False
    make_rgb: True
