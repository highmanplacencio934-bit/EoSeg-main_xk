trainer:
  default_root_dir: outputs/determinism/ce2d_stableseg_execution_v2/asee
  max_epochs: 220
  limit_val_batches: 0
  check_val_every_n_epoch: 1000000
  precision: 16-mixed
  enable_checkpointing: false
  callbacks:
  - class_path: training.synapse_physical_selection.SynapsePhysicalHD95Selection
    init_args:
      last_n_epochs: 50
      expected_test_cases: 12
      output_dir: outputs/determinism/ce2d_stableseg_execution_v2/asee
  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      save_dir: outputs/determinism/ce2d_stableseg_execution_v2/asee
      resume: allow
      project: eomt
      name: synapse-asee-execution-v2
model:
  class_path: training.synapse_physical_semantic.SynapsePhysicalHD95Semantic
  init_args:
    spacing_manifest: priors/synapse_spacing.verified.json
    num_classes: 9
    img_size:
    - 384
    - 384
    attn_mask_annealing_enabled: false
    ignore_idx: 255
    lr: 2e-4
    network:
      class_path: models.eoseg_asee.EoSegMultiQSegFusionASEE
      init_args:
        num_classes: 9
        num_q: 16
        prior_path: priors/synapse_asee_v1.pt
        queries_per_class: 2
        patch_update: plan
        freeze_text_projection: false
        enhance_patch: true
        enhance_query: true
        use_text: true
        use_probability: true
        encoder:
          class_path: models.vit.ViT
    compute_hd95_voxel: false
data:
  class_path: datasets.synapse_semantic.SynapseSemantic
  init_args:
    train_base_dir: project_TransUNet/data/Synapse/train_npz
    test_base_dir: project_TransUNet/data/Synapse/test_vol_h5
    list_dir: project_TransUNet/TransUNet/lists/lists_Synapse
    train_split: train
    test_split: test_vol
    img_size:
    - 384
    - 384
    num_classes: 9
    batch_size: 16
    num_workers: 8
    ignore_idx: 255
    drop_background: false
    make_rgb: true
deterministic_enabled: true
deterministic_protocol: ce2d_stableseg_execution_v2
deterministic_profile: asee
deterministic_probe_batches: 0
deterministic_output_dir: outputs/determinism/ce2d_stableseg_execution_v2/asee
deterministic_readiness: outputs/determinism/ce2d_stableseg_execution_v2/readiness.json
