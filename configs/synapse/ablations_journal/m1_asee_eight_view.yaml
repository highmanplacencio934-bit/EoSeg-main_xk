# M1: independent test-only config; original network/data/scientific settings preserved.
# Use scripts/run_synapse_roi.py test --ckpt_path=EXISTING_BEST --tta_views=8 --compile_test.
# The test-only callback rejects fit; per-run output/callback paths are overridden by the launcher.
trainer:
  default_root_dir: outputs/ablations/journal_20261025/M1/evaluation
  max_epochs: 220
  limit_val_batches: 0
  check_val_every_n_epoch: 1000000
  precision: 16-mixed
  enable_checkpointing: false
  callbacks:
  - class_path: training.synapse_multiscale_tta.SynapseMultiScaleTTASelection
    init_args:
      expected_test_cases: 12
      output_dir: outputs/ablations/journal_20261025/M1/evaluation
  logger: false
model:
  class_path: training.synapse_physical_semantic.SynapsePhysicalHD95Semantic
  init_args:
    num_classes: 9
    img_size:
    - 384
    - 384
    attn_mask_annealing_enabled: false
    ignore_idx: 255
    lr: 2e-4
    network:
      class_path: models.eoseg_asee.EoSegMultiQSegFusionASEE
      init_args:
        num_classes: 9
        num_q: 16
        prior_path: priors/synapse_asee_v1.pt
        queries_per_class: 2
        patch_update: plan
        freeze_text_projection: false
        enhance_patch: true
        enhance_query: true
        use_text: true
        use_probability: true
        encoder:
          class_path: models.vit.ViT
    spacing_manifest: priors/synapse_spacing.verified.json
data:
  class_path: datasets.synapse_semantic.SynapseSemantic
  init_args:
    train_base_dir: project_TransUNet/data/Synapse/train_npz
    test_base_dir: project_TransUNet/data/Synapse/test_vol_h5
    list_dir: project_TransUNet/TransUNet/lists/lists_Synapse
    train_split: train
    test_split: test_vol
    img_size:
    - 384
    - 384
    num_classes: 9
    batch_size: 16
    num_workers: 8
    ignore_idx: 255
    drop_background: false
    make_rgb: true
seed_everything: 0
tta_views: 8
